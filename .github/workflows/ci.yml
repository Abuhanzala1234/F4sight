name: CI

# Mirrors `make test` and `make lint` exactly (CLAUDE.md: "no infrastructure
# required" is the whole point of api/tests/conftest.py's design) — this
# workflow needs no Postgres, MinIO, Redis or MediaMTX service, and no model
# weights. Every test that needs real infra is marked `integration` and
# skipped here, same as on a laptop with no Docker.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: worker + api (pytest, ruff, black, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install worker + api (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e "worker[dev]" -e "api[dev]"

      - name: pytest (worker + api, no infra required)
        run: pytest worker/tests api/tests -q

      - name: ruff
        run: ruff check worker api scripts

      - name: black --check
        run: black --check worker api scripts

      - name: mypy
        # Was 30 errors when this workflow was first written -- not from a
        # code problem but from config discovery: `mypy worker/src api/src`
        # from the repo root resolves ONE pyproject.toml starting at the
        # current directory, so it never saw either sub-project's [tool.mypy]
        # (api/pyproject.toml has none of its own at all) and ran under raw
        # defaults instead. Fixed by adding [tool.mypy] to the root
        # pyproject.toml, same fix as the black line-length issue above it.
        # That alone cleared 14 errors (ignore_missing_imports finally
        # applied); pinning python_version=3.12 there (numpy's own stubs use
        # 3.12+ syntax mypy cannot parse in 3.11 mode, regardless of the
        # interpreter running it -- this does not relax the package's
        # requires-python >=3.11 floor) cleared the rest of the import
        # errors. The remaining 5 were real: enhance.py's `applied`/`params`
        # widened type mid-branch, seed.py's CAMERAS needed an explicit
        # dict[str, Any], ws.py's redis-py stub returns one broad Union
        # across every command shape, and verify.py's `verdict` needed the
        # same Literal its Pydantic field already declares (added as
        # schemas.Verdict, reused by both).
        run: mypy worker/src api/src

  dashboard:
    name: dashboard (vitest, tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run test -- --run
      - run: npx tsc --noEmit
      - run: npm run build

  walkthrough:
    name: walkthrough.py (no infra, no model weights)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e "worker[dev]"

      # scripts/demo.py and README both point to this as "prove the whole
      # evidence chain with nothing installed" — CI is exactly that claim,
      # checked. If this ever fails, the README's central demo claim is false.
      - run: python scripts/walkthrough.py
