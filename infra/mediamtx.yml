# MediaMTX — RTSP ingest, recording, and HLS restream.
# P8: recording is configured HERE, in a process the analytics worker cannot crash.

logLevel: info
logDestinations: [stdout]

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512

# --- RTSP (ingest from real cameras, and serve fixtures) ---
rtsp: yes
rtspAddress: :8554
protocols: [tcp]              # UDP drops frames silently; we always use TCP (§7.1)

# --- HLS (this is what the browser plays) ---
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigin: '*'          # dev only; tighten in the bop profile

# --- WebRTC (sub-second live wall, optional) ---
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'

api: yes
apiAddress: :9997

# MediaMTX's built-in default scopes unauthenticated `api` access to
# 127.0.0.1/::1 -- that's MediaMTX's own loopback, not the API container's,
# so the API's connect/disconnect calls (routers/cameras.py) got a 401 on
# every attempt even though the camera itself was reachable fine. Open `api`
# (and metrics/pprof, same default) to the compose network too; dev-only,
# no cross-service auth needed inside the docker network.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: metrics
      - action: pprof

# --- Recording defaults: continuous, segmented, 7-day retention (§6.3) ---
record: yes
recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
recordFormat: fmp4
recordPartDuration: 1s
recordSegmentDuration: 5m
recordDeleteAfter: 168h      # 7 days

paths:
  # ---- Fixture streams: local MP4s replayed as RTSP, forever. Tests and the
  # ---- demo run against these. Never against a live camera (CLAUDE.md/Testing).
  #
  # NOTE: this image is a scratch-based single static binary -- no shell, no
  # ffmpeg -- so a `runOnInit: ffmpeg ...` here can never run (confirmed: `docker
  # run --entrypoint sh ... ` fails with "sh: executable file not found"). These
  # paths are just declared as ordinary publish targets; the actual ffmpeg
  # process that feeds them lives in the separate `fixture-streamer` service in
  # docker-compose.yml, which pushes into the paths below over the network.
  fixture-intrusion:
    record: no

  fixture-night:
    record: no

  fixture-vehicle:
    record: no

  # ---- Real cameras: one entry per camera, source is the camera's own RTSP URL.
  # ---- `make seed` writes matching rows into the camera table.
  # bop03-cam01:
  #   source: rtsp://user:pass@10.0.3.11:554/Streaming/Channels/101
  #   sourceProtocol: tcp
  #   sourceOnDemand: no          # keep recording even with no viewer (P8)

  # Gate 4 (historical): a real, live camera was proven here against a
  # hardcoded phone IP. Left enabled with `sourceOnDemand: no`, this path
  # pulls that IP forever in the background -- and most phone RTSP servers
  # (IP Webcam included) only serve one client at a time. Any real camera
  # later connected to that same IP via the dashboard (routers/cameras.py)
  # ends up fighting this path for the phone's one connection slot, and both
  # flicker. Commented out rather than deleted: the dashboard's connect flow
  # (api/v1/cameras/{id}/connect) is the real way to bind a live camera now,
  # this static entry was only ever a one-off proof.
  # phone-cam:
  #   source: rtsp://192.168.1.12:8080/h264_ulaw.sdp
  #   sourceProtocol: tcp
  #   sourceOnDemand: no

  all_others:
    record: yes
