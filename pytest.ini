[pytest]
# Repo-root test config so `pytest` works from anywhere without installing.
pythonpath = worker/src api/src
testpaths = worker/tests api/tests
addopts = -q --strict-markers
markers =
    integration: needs docker infra (postgres/minio/redis/mediamtx)
    slow: takes more than a second
    gpu: needs a GPU
filterwarnings =
    ignore::DeprecationWarning
