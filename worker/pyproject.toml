[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti-worker"
version = "1.0.0"
description = "DRISHTI-BOP analytics worker — ingest, detect, track, score, evidence"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17",
    "scipy>=1.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "minio>=7.2",
    "structlog>=24.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "types-PyYAML",
]
# Optional accelerators — never required for `make demo` (P10).
gpu = ["onnxruntime-gpu>=1.17"]
anpr = ["pytesseract>=0.3.10"]

[project.scripts]
drishti-worker = "drishti_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs docker infra (postgres/minio/redis/mediamtx)",
    "slow: takes more than a second",
    "gpu: needs a GPU",
]

[tool.ruff.lint.per-file-ignores]
# Fail-soft by design (BUILD_SPEC §7.13, §13): a sink, a health probe or a
# single rule raising must never stop the pipeline. Every one of these catches
# logs with full context first — that is the rule CLAUDE.md actually states
# ("no silent failures"), not "never catch broadly".
"src/drishti_worker/sinks.py" = ["BLE001"]
"src/drishti_worker/enhance.py" = ["BLE001"]
"src/drishti_worker/pipeline.py" = ["BLE001"]
"src/drishti_worker/ingest.py" = ["BLE001"]
"src/drishti_worker/ledger/*.py" = ["BLE001"]
"src/drishti_worker/detect/*.py" = ["BLE001", "ARG002"]
# Tests import fixtures from a sibling module and use throwaway stubs.
"tests/*" = ["ARG002", "C408", "SLF001"]
