[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibvap-worker"
version = "1.0.0"
description = "IBVAP analytics worker — ingest, detect, track, score, evidence"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17",
    "scipy>=1.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    # [pool] is not optional: sinks.py's PostgresSink imports psycopg_pool
    # directly. Missing it doesn't fail loudly -- FanoutSink is fail-soft by
    # design (P9), so every alert just spools to disk forever with a single
    # WARN line easy to miss, while the dashboard silently shows zero alerts.
    "psycopg[binary,pool]>=3.1",
    "redis>=5.0",
    "minio>=7.2",
    "structlog>=24.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "types-PyYAML",
]
# Optional accelerators — never required for `make demo` (P10).
gpu = ["onnxruntime-gpu>=1.17"]
# Neither the plate detector nor the PaddleOCR recogniser ships in this repo
# (models/anpr/ does not exist, and fetch_models.py never fetches them), so
# ANPR falls back to whichever of these is installed -- rapidocr first
# (pretrained, no system package), then pytesseract (needs the separate
# tesseract-ocr system binary too, so it is the one usually missing).
anpr = ["rapidocr-onnxruntime>=1.2.0", "pytesseract>=0.3.10"]

[project.scripts]
ibvap-worker = "ibvap_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["N818"]

[tool.mypy]
# See the root pyproject.toml's [tool.mypy] comment: this governs mypy's
# accepted typing syntax, not the runtime floor above -- numpy's own stubs
# need 3.12+ syntax to parse at all.
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs docker infra (postgres/minio/redis/mediamtx)",
    "slow: takes more than a second",
    "gpu: needs a GPU",
]

[tool.ruff.lint.per-file-ignores]
# Fail-soft by design (BUILD_SPEC §7.13, §13): a sink, a health probe or a
# single rule raising must never stop the pipeline. Every one of these catches
# logs with full context first — that is the rule CLAUDE.md actually states
# ("no silent failures"), not "never catch broadly".
"src/ibvap_worker/sinks.py" = ["BLE001"]
"src/ibvap_worker/enhance.py" = ["BLE001"]
"src/ibvap_worker/pipeline.py" = ["BLE001"]
"src/ibvap_worker/ingest.py" = ["BLE001"]
"src/ibvap_worker/ledger/*.py" = ["BLE001"]
"src/ibvap_worker/detect/*.py" = ["BLE001", "ARG002"]
# Tests import fixtures from a sibling module and use throwaway stubs.
"tests/*" = ["ARG002", "C408", "SLF001"]
