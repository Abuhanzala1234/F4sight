# Rule engine (§7.7). Every rule is individually switchable and parameterised.
rules:
  # --- Gating that applies to EVERY rule (§7.7.1). This single block removes
  # --- most detector flicker, which is most false alerts. P3.
  gating:
    min_hits: 3               # tracker must have matched this many frames
    min_track_age_frames: 8   # and the track must be this old
    min_track_conf: 0.45      # peak confidence over the track's life
    drop_inside_mask_zones: true

  # --- Debounce (§7.7.4). Blocker #1: without this, one person standing on a
  # --- tripwire produces dozens of alerts a minute.
  #
  # DEMO MODE. cooldown_s was 45.0 and max_alerts_per_camera_per_min was 6,
  # which is correct for a real post: one operator, one screen, a queue that
  # stays triageable across a 12-hour shift. It is wrong for a live demo,
  # where somebody holds a knife up, sees one alert, does it again, and
  # nothing appears for the next 45 seconds because the (camera, track, zone,
  # rule) key is still inside its cooldown -- which reads as "the system is a
  # minute behind" rather than "the system already told you once".
  #
  # The cost of these values is real and is the thing the original numbers
  # existed to prevent: a person standing in a zone now re-alerts every ~4s,
  # and the Alerts queue fills fast. Put both back before this is anything
  # but a supervised demo.
  debounce:
    cooldown_s: 4.0
    escalate_after_s: 120.0
    correlate_window_s: 8.0       # merge rules on the SAME track into one alert
    max_alerts_per_camera_per_min: 60
    # Key is (camera_id, track_id, zone_id, rule_code) - NOT rule_code alone,
    # so a second intruder is never suppressed by the first.

  zone_intrusion:
    enabled: true
    classes: [person, vehicle]
    require_confirmed_track: true

  tripwire_cross:
    enabled: true
    classes: [person, vehicle]
    # Jitter guard, measured PERPENDICULAR to the wire (not total motion).
    # MUST stay well below one frame of walking travel at ingest.analytics_fps:
    # a person at 1.4 m/s covers ~23 cm/frame at 6 fps, which is roughly 10 px
    # at typical BOP camera scale. Set this above that and real crossings
    # disappear silently.
    min_crossing_px: 4

  loiter:
    enabled: true
    classes: [person]
    seconds: 30
    extra_step_seconds: 30        # each extra step adds risk, capped in risk.yaml

  night_movement:
    enabled: true
    classes: [person]
    # Fires only when EVQM says it is dark AND the clock agrees.
    evqm_profiles: [night, lowlight]
    window: {from: "18:30", to: "06:00"}

  perimeter_approach:
    enabled: true
    classes: [person]
    approach_px: 80
    monotonic_frames: 5           # distance must close for this many frames

  unauthorised_vehicle:
    enabled: true
    check_allow_list: true

  watchlist_face:
    enabled: false                # follows faces.enabled (P6)
    threshold: 0.55

  watchlist_plate:
    enabled: true

  crowd_forming:
    enabled: true
    crowd_min: 4
    within_zone_only: true

  # Coordinated group movement. crowd_forming above counts heads in a zone;
  # this watches what the group DOES, camera-wide -- people converging on a
  # fence are outside every zone until it is too late for the warning to help.
  group_motion:
    enabled: true
    group_min: 3                  # fewer than this is not a group
    # Measured over a window, not frame to frame: at 6 fps, 12 frames is 2s,
    # long enough that one person's stumble cannot move the group's centroid
    # enough to invent an event.
    window_frames: 12
    converge_ratio: 0.70          # spread fell to <=70% of its start
    disperse_ratio: 1.40          # or grew to >=140% of it
    # Guards the degenerate end: a group already shoulder-to-shoulder has a
    # tiny spread, and tiny numbers make big ratios out of nothing.
    min_spread_px: 60

  # Hand signals from body keypoints. CONTEXTUAL, like night_movement: these
  # enrich a real event and never raise one alone, because a person waving in
  # the middle of a field is not an alert. Tuning for the detector itself
  # (model, thresholds, how many frames must agree) is in config/gestures.yaml.
  hand_signal:
    enabled: true
    codes: [HANDS_UP, ARM_RAISED, POINTING]

  # Running. No model and no extra inference -- the tracker has already
  # measured this motion. Threshold is in BODY-HEIGHTS PER SECOND, never
  # pixels: a pixel threshold is really a threshold on how near the camera
  # somebody is. ~0.8 is walking, ~1.8 jogging, ~2.9 running, ~4.7 sprinting.
  fast_movement:
    enabled: true
    classes: [person]
    # Between a jog and a run. Measured against 466 real tracked pedestrians in
    # eval/clips (MOT16, sampled at this profile's 6 fps): walking reads
    # mean 0.30, p90 0.61, max 1.21 heights/s -- so 2.0 sits well clear of the
    # fastest ordinary walker observed, and fires zero false alarms on them.
    heights_per_s: 2.0
    # Above this is not a human, it is a tracker id switch between two people
    # standing apart -- which always looks arbitrarily fast. Discarded rather
    # than escalated, because it is a bookkeeping error, not an intruder.
    implausible_heights_per_s: 8.0
    window_frames: 5              # averaged, so one jittery box cannot fire it

  abandoned_object:
    enabled: false                # [STRETCH]
    seconds: 90
    abandon_radius_px: 150

  camera_tamper:
    enabled: true

# NOTE: rules.debounce.escalation_margin (default 10.0) controls how much
# stronger a later signal must be to break out of correlation and raise its own
# alert. Without it, a weak PERIMETER_APPROACH can swallow the TRIPWIRE_CROSS
# that follows it, and the operator triages an intrusion as "low".
