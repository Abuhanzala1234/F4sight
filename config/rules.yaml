# Rule engine (§7.7). Every rule is individually switchable and parameterised.
rules:
  # --- Gating that applies to EVERY rule (§7.7.1). This single block removes
  # --- most detector flicker, which is most false alerts. P3.
  gating:
    min_hits: 3               # tracker must have matched this many frames
    min_track_age_frames: 8   # and the track must be this old
    min_track_conf: 0.45      # peak confidence over the track's life
    drop_inside_mask_zones: true

  # --- Debounce (§7.7.4). Blocker #1: without this, one person standing on a
  # --- tripwire produces dozens of alerts a minute.
  debounce:
    cooldown_s: 45.0
    escalate_after_s: 120.0
    correlate_window_s: 8.0       # merge rules on the SAME track into one alert
    max_alerts_per_camera_per_min: 6
    # Key is (camera_id, track_id, zone_id, rule_code) - NOT rule_code alone,
    # so a second intruder is never suppressed by the first.

  zone_intrusion:
    enabled: true
    classes: [person, vehicle]
    require_confirmed_track: true

  tripwire_cross:
    enabled: true
    classes: [person, vehicle]
    # Jitter guard, measured PERPENDICULAR to the wire (not total motion).
    # MUST stay well below one frame of walking travel at ingest.analytics_fps:
    # a person at 1.4 m/s covers ~23 cm/frame at 6 fps, which is roughly 10 px
    # at typical BOP camera scale. Set this above that and real crossings
    # disappear silently.
    min_crossing_px: 4

  loiter:
    enabled: true
    classes: [person]
    seconds: 30
    extra_step_seconds: 30        # each extra step adds risk, capped in risk.yaml

  night_movement:
    enabled: true
    classes: [person]
    # Fires only when EVQM says it is dark AND the clock agrees.
    evqm_profiles: [night, lowlight]
    window: {from: "18:30", to: "06:00"}

  perimeter_approach:
    enabled: true
    classes: [person]
    approach_px: 80
    monotonic_frames: 5           # distance must close for this many frames

  unauthorised_vehicle:
    enabled: true
    check_allow_list: true

  watchlist_face:
    enabled: false                # follows faces.enabled (P6)
    threshold: 0.55

  watchlist_plate:
    enabled: true

  crowd_forming:
    enabled: true
    crowd_min: 4
    within_zone_only: true

  abandoned_object:
    enabled: false                # [STRETCH]
    seconds: 90
    abandon_radius_px: 150

  camera_tamper:
    enabled: true

# NOTE: rules.debounce.escalation_margin (default 10.0) controls how much
# stronger a later signal must be to break out of correlation and raise its own
# alert. Without it, a weak PERIMETER_APPROACH can swallow the TRIPWIRE_CROSS
# that follows it, and the operator triages an intrusion as "low".
