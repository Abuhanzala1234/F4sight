# ANPR (§7.9). Off the hot path; runs in a pool fed by vehicle-track crops.
anpr:
  enabled: true
  plate_detector_weights: models/anpr/plate-yolo11n.onnx
  ocr_rec_weights: models/anpr/en_PP-OCRv4_rec.onnx
  ocr_det_weights: models/anpr/ch_PP-OCRv4_det.onnx
  fallback_ocr: tesseract         # used only if the ONNX recogniser is missing

  min_plate_width_px: 80          # below this, OCR on CCTV is guessing
  plate_conf: 0.45
  max_crops_per_track: 12
  max_tracks_per_frame: 1          # at most one heavy OCR call per eligible frame
  classes: [vehicle]               # which of our own taxonomy's classes get cropped

  # Only every Nth frame gets a real OCR attempt per unsettled vehicle track
  # (a cached, already-settled hit is unaffected -- it returns every frame
  # regardless). "cheap next to detection" only holds for the fine-tuned
  # PaddleOCR-CTC ONNX model this was designed around; the fallbacks this repo
  # actually ships with (models/anpr/ is empty by default) are not cheap --
  # RapidOCR measured 170-1700ms per crop on a laptop CPU and, run every
  # frame, starved the shared detector thread badly enough to push its own
  # inference time from ~30ms to ~200ms. Safe to drop back to 1 once real
  # plate-specific ONNX weights are in place.
  every_n_frames: 10

  # RapidOCR fallback tuning (plate_ocr.py). Its stock defaults cost ~520ms
  # per read on a laptop CPU for two reasons, both measured: its text detector
  # upscales every image until the SHORT side reaches 736px (a ~300x120 plate
  # strip became ~1840x736 before detection even ran), and it builds its three
  # ONNX sessions with no thread cap, so each one grabs every core and fights
  # the primary detector for them -- which is how a vehicle on screen pushed
  # primary inference from ~80ms to 600-800ms in a live CCTV run. 320px and 2
  # threads, plus skipping its 180-degree angle classifier (plates are never
  # upside down), measured 106ms on the same crop and still read the plate.
  ocr_threads: 2
  ocr_det_limit_side_len: 320

  # How often the worker reloads watchlist_vehicle from Postgres. A DB that is
  # not up yet just means no NEW hits until the next refresh succeeds (P9) --
  # the worker keeps reading and voting on plates regardless.
  watchlist_refresh_s: 60

  # Multi-frame voting is MANDATORY (§7.9). Single-frame CCTV OCR is not
  # trustworthy and P3 applies.
  voting:
    min_frames_agreed: 3
    min_char_conf: 0.55
    window_frames: 30

  region: IN
  # Structural patterns accepted by validate_indian_plate().
  patterns:
    - "^[A-Z]{2}[0-9]{1,2}[A-Z]{1,3}[0-9]{4}$"   # standard  e.g. HR26DA1234
    - "^[0-9]{2}BH[0-9]{4}[A-Z]{1,2}$"           # Bharat series
    - "^[A-Z]{2}[0-9]{2}[0-9]{4}$"               # older/military-style
  # 80% of real OCR error is these five confusions.
  confusions: {"O": "0", "I": "1", "S": "5", "B": "8", "Z": "2"}

  # P6: the DB holds an HMAC, never plaintext. Plaintext exists only inside a
  # fired alert's evidence_doc, and reading it writes an audit_log row.
  storage:
    hash_only: true
    hmac_key_env: PLATE_HMAC_KEY
    keep_plaintext_in_fired_alert_evidence: true
