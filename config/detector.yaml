# Object detection (§7.4). All weights are free; see docs/MODELS.md.
detector:
  backend: onnx              # onnx | tensorrt | mock
  model: yolo11n             # yolo11n | yolo11s | rtdetr_r18  (rtdetr = Apache-2.0 path)
  weights: models/detect/yolo11n.onnx
  input_size: [640, 640]
  # Blocker #3: cold start. Never skip this.
  warmup_iterations: 10
  warmup_required: true      # worker does not report ready until warmup finishes

  # ONNX Runtime execution providers, tried in order. CoreML keeps the macOS
  # laptop profile usable; CUDA/TensorRT take over on a real box.
  providers: [TensorrtExecutionProvider, CUDAExecutionProvider,
              CoreMLExecutionProvider, CPUExecutionProvider]
  # NOT 0 ("ORT decides"), which means one thread per core PER SESSION -- and
  # the worker loads three sessions (detect, pose, weapon), so on a 12-core
  # box that alone asked for 36 compute threads before a single camera was
  # decoded. Measured with 4 cameras running: 168 threads on 12 cores and
  # per-frame inference at 400ms, against ~57ms for the same model when the
  # pools were not fighting each other. The cores were pinned context
  # switching, not inferring. A small model at this input size gets nearly all
  # of its threading benefit in the first few threads anyway.
  intra_op_threads: 4
  fp16: true                 # ignored on CPU; passed to TensorRT as trt_fp16_enable

  # GPU tuning. Inert on CPU and CoreML, so these are safe to leave set.
  gpu:
    device_id: 0
    gpu_mem_limit_mb: 0      # 0 = let the driver decide. Set it when the box
                             # shares the GPU with anything else.
    # HEURISTIC, not ORT's EXHAUSTIVE default: EXHAUSTIVE benchmarks every
    # convolution algorithm at session init, which adds seconds to a cold start
    # (blocker #3) to win a few percent in steady state.
    cudnn_conv_algo_search: HEURISTIC
    trt_workspace_mb: 1024
    # THE reason a TensorRT restart is survivable. The first inference builds a
    # kernel-tuned engine — tens of seconds to minutes. Cached, the next start
    # deserialises it. Cache is keyed to the graph, the shapes and the device,
    # so it rebuilds by itself when any of those change.
    trt_engine_cache_dir: models/trt_cache
    trt_timing_cache: true

  batching:
    max_batch: 8
    max_wait_ms: 15          # fire a partial batch rather than add latency

  nms:
    iou: 0.45
    max_detections: 100
    class_agnostic: true

  # P3: err high. Different classes deserve different thresholds.
  conf_thresholds:
    person: 0.40
    vehicle: 0.45
    animal: 0.50
    bag: 0.55
    default: 0.50

  # Minimum box size in pixels. Below this a "detection" is noise at range.
  min_box_area_px: 200
  min_box_height_px: 18

  # COCO class id -> our taxonomy (§7.4). Anything unmapped is dropped before
  # the tracker ever sees it.
  class_map:
    0:  {cls: person,  }
    1:  {cls: vehicle, vehicle_type: bicycle}
    2:  {cls: vehicle, vehicle_type: car}
    3:  {cls: vehicle, vehicle_type: motorcycle}
    5:  {cls: vehicle, vehicle_type: bus}
    7:  {cls: vehicle, vehicle_type: truck}
    15: {cls: animal,  animal_type: cat}
    16: {cls: animal,  animal_type: dog}
    17: {cls: animal,  animal_type: horse}
    18: {cls: animal,  animal_type: sheep}
    19: {cls: animal,  animal_type: cow}
    24: {cls: bag,     bag_type: backpack}
    26: {cls: bag,     bag_type: handbag}
    28: {cls: bag,     bag_type: suitcase}
